<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bali Express Video Maker</title>
<style>
:root{--page:#efe8dc;--paper:#f8f4ec;--sand:#e6dccb;--line:#d9cdb8;--ink:#3b342b;--muted:#8b7f6e;--red:#d9472b;--red-dark:#b93a22}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--page);color:var(--ink);line-height:1.5}
main{max-width:620px;margin:0 auto;padding:40px 18px 72px}
header{text-align:center;margin-bottom:28px}
header img{width:210px;max-width:60%}
header p{margin:10px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 22px 26px;margin-bottom:16px}
h2{font-size:15px;font-weight:700;margin:0 0 4px}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.field{margin-top:16px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field small{font-weight:400;color:var(--muted)}
.pick{display:flex;align-items:center;gap:12px;background:#fffdf8;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px}
.pick input{display:none}
.pick b{flex:none;font-size:13px;font-weight:600;background:var(--sand);padding:8px 14px;border-radius:8px;cursor:pointer}
.pick b:hover{background:#dccfb8}
.pick em{font-style:normal;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick:focus-within{outline:3px solid var(--ink);outline-offset:2px}
textarea,select,input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fffdf8;color:var(--ink);font:inherit;font-size:14px}
textarea{min-height:140px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
textarea:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button#go{margin-top:6px;width:100%;padding:15px;border:0;border-radius:12px;background:var(--red);color:#fff;font:700 16px Montserrat,sans-serif;cursor:pointer}
button#go:hover{background:var(--red-dark)}
button#go:disabled{opacity:.55;cursor:wait}
progress{width:100%;height:8px;margin-top:18px;accent-color:var(--red)}
#status{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.4em;text-align:center}
#out{margin-top:14px;text-align:center}
#out video{max-height:600px;max-width:100%;background:#000;border-radius:12px}
#out a{display:block;margin-top:12px;font-weight:700;color:var(--red-dark)}
</style>
</head>
<body>
<main>
  <header>
    <img src="/logo.png" alt="Bali Express">
    <p>Foto, suara, dan naskah jadi video berita vertikal.</p>
  </header>

  <section class="card">
    <h2>Bahan video</h2>
    <p class="hint">Foto diputar berurutan dan diulang sampai voice over selesai.</p>
    <label class="field"><span>Foto</span>
      <div class="pick"><input id="photos" type="file" accept="image/*" multiple><b>Pilih foto</b><em id="photosName">Belum ada file</em></div></label>
    <label class="field"><span>Voice over</span>
      <div class="pick"><input id="vo" type="file" accept="audio/*"><b>Pilih audio</b><em id="voName">Belum ada file</em></div></label>
    <label class="field"><span>File SRT <small>(opsional)</small></span>
      <div class="pick"><input id="srt" type="file" accept=".srt"><b>Pilih SRT</b><em id="srtName">Belum ada file</em></div></label>
    <label class="field"><span>Teks naskah <small>(dipakai kalau tidak ada SRT)</small></span>
      <textarea id="script" placeholder="Tempel naskah di sini. Timing subtitle dibagi mengikuti suara VO."></textarea></label>
  </section>

  <section class="card">
    <h2>Pengaturan</h2>
    <div class="grid">
      <label class="field"><span>Resolusi</span>
        <select id="res"><option value="720">720 x 1280 (lebih cepat)</option><option value="1080">1080 x 1920</option></select></label>
      <label class="field"><span>Detik per foto</span><input id="dur" type="number" min="1" step="0.5" value="4"></label>
      <label class="field"><span>Gerak foto</span>
        <select id="motion"><option value="on">Zoom dan geser</option><option value="off">Diam</option></select></label>
      <label class="field"><span>Geser subtitle <small>(detik)</small></span><input id="shift" type="number" step="0.1" value="0"></label>
    </div>
    <p class="hint" style="margin-top:12px">Subtitle terasa kecepatan? Isi angka plus supaya muncul lebih lambat, misalnya 0,5.</p>
  </section>

  <button id="go">Render video</button>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="status"></div>
  <div id="out"></div>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
